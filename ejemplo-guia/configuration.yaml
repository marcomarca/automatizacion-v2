# Configuración consolidada Witmind — paneles con menú lateral de Home Assistant.
# Integra este contenido con tu configuration.yaml actual y evita duplicar claves.

default_config:

# Acceso HTTPS mediante certificado Let's Encrypt generado por Dynu DNS.
http:
  ssl_certificate: /ssl/fullchain.pem
  ssl_key: /ssl/privkey.pem

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/witmind-fonts.js
    - /local/witmind-default-panel.js?v=1.4.0

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Calendario laboral persistente Witmind. Los registros se guardan en .storage
# y el panel los administra mediante WebSocket; no se incrustan en automatizaciones.
calendario_laboral:

# Subsistema Witmind de notificaciones persistentes.
# Las reglas se guardan en .storage y se ejecutan desde el backend aunque el panel esté cerrado.
witmind_notifications:
  history_limit: 500

# Barrera backend para el apagado crítico. La autorización dura 20 segundos,
# es de un solo uso y no se restaura después de reiniciar Home Assistant.
timer:
  ventana_apagado_total:
    name: Ventana de apagado total
    duration: "00:00:20"
    restore: false
    icon: mdi:shield-lock-clock

# -----------------------------------------------------------------------------
# CLIMATIZACIÓN WITMIND — AJUSTES PERSISTENTES + ESTADO DE COMANDO DETERMINISTA
#
# Persisten después de reiniciar:
#   - activación de rutina mañana/tarde
#   - horarios
#   - umbrales
#   - velocidad de ventilador por perfil mañana/tarde
#   - temperatura enviada por cada perfil automático
#   - temperatura objetivo canónica mostrada por el panel
#   - fase térmica diaria y fecha de validez por perfil
#
# NO persisten deliberadamente como estado operativo de sesión:
#   - estado/modo comandado
#   - autoridad AUTO/MANUAL/RECOVERY/FAULT
#   - demanda de calor/frío
#   - bandera de sincronización
#
# El sistema IR trabaja en lazo abierto. Tras cada reinicio se descarta MANUAL,
# se entra en RECOVERY y se invalida solo la memoria operativa de sesión. La
# demanda se reconstruye con temperatura + umbrales + fase térmica válida de hoy.
# -----------------------------------------------------------------------------
input_boolean:
  climatizacion_config_inicializada:
    name: Climatización · Configuración inicializada
    icon: mdi:database-check-outline

  climatizacion_manana_activa:
    name: Climatización · Rutina mañana
    icon: mdi:weather-sunset-up

  climatizacion_tarde_activa:
    name: Climatización · Rutina tarde
    icon: mdi:weather-sunset-down

  # Migración persistente de los objetivos por perfil. No lleva initial: después
  # de la primera inicialización queda ON y no vuelve a sobrescribir lo elegido.
  climatizacion_objetivos_config_inicializada:
    name: Climatización · Objetivos por perfil inicializados
    icon: mdi:thermostat-check

  # Estado de la ÚLTIMA intención de potencia registrada por el controlador.
  # Se confirma ANTES de transmitir IR: en lazo abierto la interfaz representa
  # el estado deseado/comandado, no un supuesto feedback físico del equipo.
  # initial:false impide restaurar un ON anterior después de reiniciar.
  climatizacion_estado_comandado:
    name: Climatización · Estado comandado
    initial: false
    icon: mdi:power

  # Solo vale dentro de la sesión actual. Se pone ON después de completar
  # una reconciliación RECOVERY válida. initial:false impide restaurar sesión.
  climatizacion_sincronizado_sesion:
    name: Climatización · Sincronizada esta sesión
    initial: false
    icon: mdi:sync-circle

  # Memoria del algoritmo de histéresis. No representan estado físico.
  climatizacion_demanda_calor:
    name: Climatización · Demanda calor
    initial: false
    icon: mdi:fire

  climatizacion_demanda_frio:
    name: Climatización · Demanda frío
    initial: false
    icon: mdi:snowflake

input_select:
  # Último modo que nuestro controlador ordenó. UNKNOWN se usa cuando se pierde
  # confianza lógica (por ejemplo MASTER POWER OFF o un climate unavailable).
  climatizacion_modo_comandado:
    name: Climatización · Modo comandado
    options:
      - unknown
      - "off"
      - auto
      - cool
      - heat
      - dry
      - fan_only
    initial: unknown
    icon: mdi:air-conditioner

  climatizacion_ventilador_comandado:
    name: Climatización · Ventilador comandado
    options:
      - auto
      - low
      - medium
      - high
    initial: auto
    icon: mdi:fan

  # Velocidad persistente que usará cada perfil automático. El modo HVAC no es
  # configurable aquí: mañana siempre HEAT y tarde siempre COOL.
  climatizacion_manana_ventilador:
    name: Climatización · Mañana ventilador
    options:
      - auto
      - low
      - medium
      - high
    icon: mdi:fan-speed-1

  climatizacion_tarde_ventilador:
    name: Climatización · Tarde ventilador
    options:
      - auto
      - low
      - medium
      - high
    icon: mdi:fan-speed-2

  # Memoria térmica persistente diaria. Sin initial: Home Assistant restaura el
  # último valor; la fecha asociada decide si esa fase todavía es válida hoy.
  climatizacion_manana_fase_termica:
    name: Climatización · Mañana fase térmica
    options:
      - buscando_alta
      - esperando_baja
    icon: mdi:thermometer-lines

  climatizacion_tarde_fase_termica:
    name: Climatización · Tarde fase térmica
    options:
      - buscando_baja
      - esperando_alta
    icon: mdi:thermometer-lines

  # Autoridad de control. initial: recovery garantiza que MANUAL no se restaure
  # después de reiniciar Home Assistant.
  climatizacion_control_mode:
    name: Climatización · Autoridad de control
    options:
      - auto
      - manual
      - recovery
      - fault
    initial: recovery
    icon: mdi:account-switch-outline

input_text:
  climatizacion_ultimo_evento:
    name: Climatización · Último evento de control
    initial: "Inicializando controlador de climatización"
    max: 255
    icon: mdi:message-text-clock-outline

  # Fechas ISO locales (YYYY-MM-DD) de la memoria térmica. Sin initial para que
  # sobrevivan reinicios; cualquier fecha distinta de now().date() se ignora.
  climatizacion_manana_fase_fecha:
    name: Climatización · Mañana fecha de fase térmica
    max: 10
    icon: mdi:calendar-check-outline

  climatizacion_tarde_fase_fecha:
    name: Climatización · Tarde fecha de fase térmica
    max: 10
    icon: mdi:calendar-check-outline

input_datetime:
  climatizacion_manana_inicio:
    name: Climatización · Mañana inicio
    has_date: false
    has_time: true
    icon: mdi:clock-start

  climatizacion_manana_fin:
    name: Climatización · Mañana fin
    has_date: false
    has_time: true
    icon: mdi:clock-end

  climatizacion_tarde_inicio:
    name: Climatización · Tarde inicio
    has_date: false
    has_time: true
    icon: mdi:clock-start

  climatizacion_tarde_fin:
    name: Climatización · Tarde fin
    has_date: false
    has_time: true
    icon: mdi:clock-end

input_number:
  # Fuente de verdad de temperatura objetivo para el control IR a lazo abierto.
  # El panel, los botones +/- y cada orden manual leen este valor absoluto; no se
  # calcula ningún delta a partir del estado reportado por climate.*. No se fuerza
  # un initial en cada arranque; si aún no hay un valor numérico, el backend usa
  # 16 °C como fallback determinista.
  climatizacion_temperatura_comandada:
    name: Climatización · Temperatura objetivo comandada
    min: 16
    max: 30
    step: 1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermostat

  climatizacion_manana_apagar_en:
    name: Climatización · Mañana apagar en
    min: 16
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up

  climatizacion_manana_encender_en:
    name: Climatización · Mañana reencender en
    min: 16
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down

  # Consigna persistente enviada en HEAT. Puede ser mayor que el umbral del
  # sensor; nunca menor. El backend la corrige automáticamente si hiciera falta.
  climatizacion_manana_temperatura_objetivo:
    name: Climatización · Mañana temperatura enviada
    min: 16
    max: 30
    step: 1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-plus

  climatizacion_tarde_encender_en:
    name: Climatización · Tarde encender en
    min: 16
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up

  climatizacion_tarde_apagar_en:
    name: Climatización · Tarde apagar en
    min: 16
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down

  # Consigna persistente enviada en COOL. Puede ser menor que el umbral del
  # sensor; nunca mayor. El backend la corrige automáticamente si hiciera falta.
  climatizacion_tarde_temperatura_objetivo:
    name: Climatización · Tarde temperatura enviada
    min: 16
    max: 30
    step: 1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-minus

template:
  - sensor:
      # Sensor de referencia de climatización: temperatura de Oficina general.
      # No confundir con sensor.t_h_sensor_temperature, que corresponde a Gerencia Witronix.
      - name: "Climatizacion Temperatura Referencia"
        unique_id: climatizacion_temperatura_referencia
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer
        availability: >
          {{ is_number(states('sensor.t_h_sensor_2_temperature')) }}
        state: >
          {{ states('sensor.t_h_sensor_2_temperature') | float(0) }}

      - name: "Showroom Luminarias Encendidas"
        unique_id: showroom_luminarias_encendidas
        unit_of_measurement: "luces"
        icon: mdi:lightbulb-on
        state: >
          {{ [
            states('switch.interruptor_inteligente_switch_1'),
            states('switch.interruptor_inteligente_switch_2'),
            states('switch.interruptor_inteligente_switch_3'),
            states('switch.interruptor_inteligente_switch_4'),
            states('switch.interruptor_inteligente_2_switch_1'),
            states('switch.interruptor_inteligente_2_switch_2'),
            states('switch.interruptor_inteligente_2_switch_3'),
            states('switch.interruptor_inteligente_2_switch_4'),
            states('switch.smart_relay_switch_4_switch'),
            states('switch.smart_relay_switch_3_switch')
          ] | select('eq', 'on') | list | count }}

      # Potencia lógica del showroom. No mide físicamente: suma la potencia
      # nominal de cada circuito cuyo switch está ON. El reflector exterior queda
      # fuera hasta conocer su potencia real; no se asigna ningún valor supuesto.
      - name: "Showroom Potencia Estimada"
        unique_id: showroom_potencia_estimada
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt
        availability: >
          {{ states('switch.interruptor_inteligente_switch_1') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_switch_2') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_switch_3') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_switch_4') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_2_switch_1') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_2_switch_2') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_2_switch_3') not in ['unknown','unavailable'] and
             states('switch.interruptor_inteligente_2_switch_4') not in ['unknown','unavailable'] and
             states('switch.smart_relay_switch_4_switch') not in ['unknown','unavailable'] }}
        state: >
          {{
            (100 if is_state('switch.interruptor_inteligente_switch_1', 'on') else 0) +
            (120 if is_state('switch.interruptor_inteligente_switch_2', 'on') else 0) +
            (180 if is_state('switch.interruptor_inteligente_switch_3', 'on') else 0) +
            (25 if is_state('switch.interruptor_inteligente_switch_4', 'on') else 0) +
            (96 if is_state('switch.interruptor_inteligente_2_switch_1', 'on') else 0) +
            (10 if is_state('switch.interruptor_inteligente_2_switch_2', 'on') else 0) +
            (432 if is_state('switch.interruptor_inteligente_2_switch_3', 'on') else 0) +
            (144 if is_state('switch.interruptor_inteligente_2_switch_4', 'on') else 0) +
            (288 if is_state('switch.smart_relay_switch_4_switch', 'on') else 0)
          }}
        attributes:
          potencia_instalada_conocida_w: 1395
          circuitos_incluidos: 9
          reflector_exterior_incluido: false

      - name: "Lobby Luminarias Encendidas"
        unique_id: lobby_luminarias_encendidas
        unit_of_measurement: "luces"
        icon: mdi:lightbulb-on
        state: >
          {{ [
            states('switch.interruptor_inteligente_3_switch_1'),
            states('switch.interruptor_inteligente_3_switch_2'),
            states('switch.interruptor_inteligente_3_switch_3'),
            states('switch.interruptor_inteligente_3_switch_4')
          ] | select('eq', 'on') | list | count }}

      - name: "Oficinas Luminarias Encendidas"
        unique_id: oficinas_luminarias_encendidas
        unit_of_measurement: "luces"
        icon: mdi:lightbulb-on
        state: >
          {{ [
            states('switch.b2_gang_interruptor_1'),
            states('switch.b2_gang_interruptor_2'),
            states('switch.oficina_grande_interruptor_1'),
            states('switch.oficina_grande_interruptor_2'),
            states('switch.oficina_mindtec_interruptor_1'),
            states('switch.oficina_gerencial_interruptor_1'),
            states('switch.taller_interruptor_1')
          ] | select('eq', 'on') | list | count }}

  # Política central para automatizaciones laborales. Conserva el calendario de
  # feriados como fuente independiente y añade el fin de jornada del sábado.
  - binary_sensor:
      - name: "Bloqueo Automatizaciones Laborales"
        unique_id: bloqueo_automatizaciones_laborales
        icon: mdi:calendar-clock
        state: >-
          {{ not is_state('binary_sensor.dia_no_laborable', 'off') or
             (now().weekday() == 5 and now().hour >= 13) }}
        attributes:
          motivo: >-
            {% if not is_state('binary_sensor.dia_no_laborable', 'off') %}
              {{ state_attr('binary_sensor.dia_no_laborable', 'motivo') or 'Calendario laboral no disponible' }}
            {% elif now().weekday() == 5 and now().hour >= 13 %}
              Fin de jornada del sábado
            {% else %}
              Día laboral
            {% endif %}
          corte_sabado: "13:00"

# Convierte la potencia lógica (W) en un contador energético acumulado (kWh).
# method:left es adecuado porque la potencia cambia por escalones al conmutar switches.
# max_sub_interval mantiene el acumulado actualizado incluso sin cambios de estado.
sensor:
  - platform: integration
    source: sensor.showroom_potencia_estimada
    name: "Showroom Energia Estimada"
    unique_id: showroom_energia_estimada
    unit_prefix: k
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 5

panel_custom:
  # Panel consolidado para escenas principales, rutinas diarias y apagado total.
  # Archivo requerido: /config/www/control-general-panel.js
  - name: control-general-panel
    url_path: control-general
    sidebar_title: Control general
    sidebar_icon: mdi:shield-home-outline
    module_url: /local/control-general-panel.js?v=1.3.1
    require_admin: false
    config:
      title: Control general
      subtitle: Escenas y rutinas operativas
      site_label: WTX · MDTC
      logo: /local/logo-witmind.png?v=2.0.0
      weather: weather.forecast_casa

      # Resumen de estado por área. Estas mismas entidades se reutilizan en el
      # apagado total para cubrir todos los circuitos solicitados.
      zones:
        - id: showroom
          name: Showroom
          icon: showroom
          entities:
            - switch.interruptor_inteligente_switch_1
            - switch.interruptor_inteligente_switch_2
            - switch.interruptor_inteligente_switch_3
            - switch.interruptor_inteligente_switch_4
            - switch.interruptor_inteligente_2_switch_1
            - switch.interruptor_inteligente_2_switch_2
            - switch.interruptor_inteligente_2_switch_3
            - switch.interruptor_inteligente_2_switch_4
            - switch.smart_relay_switch_4_switch
            - switch.smart_relay_switch_3_switch

        - id: lobby
          name: Lobby
          icon: lobby
          entities:
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3
            - switch.interruptor_inteligente_3_switch_4
        - id: oficinas
          name: Oficinas
          icon: office
          entities:
            - switch.oficina_gerencial_interruptor_1
            - switch.oficina_mindtec_interruptor_1
            - switch.oficina_grande_interruptor_1
            - switch.oficina_grande_interruptor_2
            - switch.b2_gang_interruptor_1
            - switch.b2_gang_interruptor_2
            - switch.taller_interruptor_1

        - id: grabacion
          name: Sala de grabación
          icon: recording
          entities:
            - switch.4gang_switch_sala_grabacion_interruptor_1
            - switch.4gang_switch_sala_grabacion_interruptor_2
            - switch.4gang_switch_sala_grabacion_interruptor_3
            - switch.4gang_switch_sala_grabacion_interruptor_4

      # Se llama primero a la escena o script existente y después se fuerza el
      # perfil exacto con control directo. El panel verifica los estados reales.
      main_actions:
        - id: showroom-reunion
          name: Modo reunión
          subtitle: Showroom · Ventana + Spots 2x3
          icon: people
          service_entities:
            - scene.reunion
          on_entities:
            - switch.interruptor_inteligente_switch_1
            - switch.interruptor_inteligente_switch_2
          off_entities:
            - switch.interruptor_inteligente_switch_3
            - switch.interruptor_inteligente_switch_4
            - switch.interruptor_inteligente_2_switch_1
            - switch.interruptor_inteligente_2_switch_2
            - switch.interruptor_inteligente_2_switch_3
            - switch.interruptor_inteligente_2_switch_4
            - switch.smart_relay_switch_4_switch

        - id: showroom-presentacion
          name: Modo presentación
          subtitle: Showroom · Colgantes + Ventana + TV
          icon: presentation
          service_entities:
            - scene.presentacion
          on_entities:
            - switch.interruptor_inteligente_2_switch_2
            - switch.interruptor_inteligente_switch_1
            - switch.interruptor_inteligente_switch_4
          off_entities:
            - switch.interruptor_inteligente_switch_2
            - switch.interruptor_inteligente_switch_3
            - switch.interruptor_inteligente_2_switch_1
            - switch.interruptor_inteligente_2_switch_3
            - switch.interruptor_inteligente_2_switch_4
            - switch.smart_relay_switch_4_switch

        - id: showroom-apagado
          name: Apagar Showroom
          subtitle: Apagado completo, incluido reflector exterior
          icon: power
          tone: off
          service_entities:
            - script.showroom_apagado_general
          off_entities:
            - switch.interruptor_inteligente_switch_1
            - switch.interruptor_inteligente_switch_2
            - switch.interruptor_inteligente_switch_3
            - switch.interruptor_inteligente_switch_4
            - switch.interruptor_inteligente_2_switch_1
            - switch.interruptor_inteligente_2_switch_2
            - switch.interruptor_inteligente_2_switch_3
            - switch.interruptor_inteligente_2_switch_4
            - switch.smart_relay_switch_4_switch
            - switch.smart_relay_switch_3_switch

        - id: lobby-regular
          name: Modo regular
          subtitle: Lobby · Solo Spots 10W
          icon: bulb
          on_entities:
            - switch.interruptor_inteligente_3_switch_4
          off_entities:
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3

        - id: lobby-visita
          name: Modo visita
          subtitle: Lobby · Todos los circuitos principales
          icon: visit
          on_entities:
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3
            - switch.interruptor_inteligente_3_switch_4

        - id: lobby-apagado
          name: Apagar Lobby
          subtitle: Apaga los cuatro circuitos actuales del Lobby
          icon: power
          tone: off
          off_entities:
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3
            - switch.interruptor_inteligente_3_switch_4
      daily_actions:
        # Perfil determinista de apertura. Solo modifica Showroom, Lobby,
        # Witronix LED, Multifuncional y Pasillo; las demás oficinas conservan
        # exactamente el estado que tenían antes de ejecutar la rutina.
        - id: inicio-dia
          name: Inicio de día
          subtitle: Spots 10W + Witronix LED + Multifuncional
          icon: sunrise
          tone: day
          on_entities:
            # Lobby: únicamente Spots 10W.
            - switch.interruptor_inteligente_3_switch_4
            # Oficinas: circuitos expresamente incluidos en la rutina.
            - switch.oficina_gerencial_interruptor_1
            - switch.b2_gang_interruptor_1
          off_entities:
            # Showroom: apagado completo, incluido el reflector exterior.
            - switch.interruptor_inteligente_switch_1
            - switch.interruptor_inteligente_switch_2
            - switch.interruptor_inteligente_switch_3
            - switch.interruptor_inteligente_switch_4
            - switch.interruptor_inteligente_2_switch_1
            - switch.interruptor_inteligente_2_switch_2
            - switch.interruptor_inteligente_2_switch_3
            - switch.interruptor_inteligente_2_switch_4
            - switch.smart_relay_switch_4_switch
            - switch.smart_relay_switch_3_switch
            # Lobby: los otros tres circuitos apagados; Spots 10W encendido.
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3
            # Oficinas: Pasillo apagado. Mindtec, oficina general y taller
            # no aparecen aquí y, por tanto, no se modifican.
            - switch.b2_gang_interruptor_2

        - id: fin-dia
          name: Fin de día
          subtitle: Apaga completamente Showroom y Lobby
          icon: sunset
          tone: off
          service_entities:
            - script.showroom_apagado_general
          off_entities:
            - switch.interruptor_inteligente_switch_1
            - switch.interruptor_inteligente_switch_2
            - switch.interruptor_inteligente_switch_3
            - switch.interruptor_inteligente_switch_4
            - switch.interruptor_inteligente_2_switch_1
            - switch.interruptor_inteligente_2_switch_2
            - switch.interruptor_inteligente_2_switch_3
            - switch.interruptor_inteligente_2_switch_4
