      default_period: day

      # Horario utilizado para detectar consumo fuera de horario.
      after_hours_start: 22
      after_hours_end: 7

      # Potencias nominales conocidas. El reflector exterior se excluye hasta
      # contar con su potencia real. El panel calcula: Wh = watts × horas encendido.
      circuits:
        - entity: switch.interruptor_inteligente_switch_1
          name: Spots ventana
          subtitle: Zona ventana
          watts: 100
        - entity: switch.interruptor_inteligente_switch_2
          name: Spots 2x3
          subtitle: Muestra 2 × 3
          watts: 120
        - entity: switch.interruptor_inteligente_switch_3
          name: Spots 3x3
          subtitle: Muestra 3 × 3
          watts: 180
        - entity: switch.interruptor_inteligente_switch_4
          name: Spots TV
          subtitle: Zona audiovisual
          watts: 25
        - entity: switch.interruptor_inteligente_2_switch_1
          name: Paneles 3k/6k
          subtitle: Temperaturas de color
          watts: 96
        - entity: switch.interruptor_inteligente_2_switch_2
          name: Colgantes
          subtitle: Muestra suspendida
          watts: 10
        - entity: switch.interruptor_inteligente_2_switch_3
          name: Slims
          subtitle: Línea decorativa
          watts: 432
        - entity: switch.interruptor_inteligente_2_switch_4
          name: Downlights
          subtitle: Iluminación empotrada
          watts: 144
        - entity: switch.smart_relay_switch_4_switch
          name: Paneles
          subtitle: Control por relé
          watts: 288
        # Reflector exterior pendiente: agregarlo aquí cuando se conozca su potencia real.

