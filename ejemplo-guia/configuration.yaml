  # Panel unificado de climatización. La interfaz presenta un solo sistema,
  # pero cada acción se envía simultáneamente a ambos controladores IR.
  # Archivo requerido: /config/www/climatizacion-panel.js
  - name: climatizacion-panel
    url_path: climatizacion
    sidebar_title: Climatización
    sidebar_icon: mdi:air-conditioner
    module_url: /local/climatizacion-panel.js?v=1.6.12
    require_admin: false
    config:
      title: Climatización
      subtitle: Oficinas Witronix
      logo: /local/logo-witmind.png?v=2.0.0

      # Entidades internas. El usuario no ve ni selecciona equipos individuales.
      # Todas las acciones climate.* se aplican a la lista completa.
      entities:
        - climate.aire_acondicionado_iris
        - climate.aire_acondicionado_midea

      min_temp: 16
      max_temp: 30
      temp_step: 1
      default_on_mode: cool

      # Sensor virtual estable usado por panel y automatizaciones. El sensor
      # físico de origen se cambia una sola vez en template: al inicio del archivo.
      reference_temperature_sensor: sensor.climatizacion_temperatura_referencia
      reference_temperature_label: Temperatura oficina

      # MASTER POWER: el panel permite encender/apagar este relé de alimentación.
      # Protección: si HVAC está comandado ON, el panel bloquea el corte hasta
      # que IRIS + MIDEA hayan recibido primero una orden HVAC OFF.
      master_relay: switch.smart_relay_switch_interruptor

      # Contador acumulado de energía del mismo relé. Las gráficas usan Recorder;
      # "Consumo del mes" usa la resta absoluta entre el primer valor registrado
      # desde el día 1 y el valor vivo actual del contador.
      energy_sensor: sensor.smart_relay_switch_energia_total

      # Sensor físico de temperatura de las oficinas. Solo se usa como historial
      # superpuesto en la gráfica Día; no altera la automatización climática.
      temperature_history_sensor: sensor.t_h_sensor_2_temperature

      # Helpers persistentes editables desde el propio panel.
      automation_config_initialized: input_boolean.climatizacion_config_inicializada
      morning_enabled: input_boolean.climatizacion_manana_activa
      afternoon_enabled: input_boolean.climatizacion_tarde_activa
      morning_start: input_datetime.climatizacion_manana_inicio
      morning_end: input_datetime.climatizacion_manana_fin
      afternoon_start: input_datetime.climatizacion_tarde_inicio
      afternoon_end: input_datetime.climatizacion_tarde_fin
      morning_off_temp: input_number.climatizacion_manana_apagar_en
      morning_on_temp: input_number.climatizacion_manana_encender_en
      morning_target_temp: input_number.climatizacion_manana_temperatura_objetivo
      afternoon_on_temp: input_number.climatizacion_tarde_encender_en
      afternoon_off_temp: input_number.climatizacion_tarde_apagar_en
      afternoon_target_temp: input_number.climatizacion_tarde_temperatura_objetivo
      morning_fan: input_select.climatizacion_manana_ventilador
      afternoon_fan: input_select.climatizacion_tarde_ventilador

      # Estado lógico de la última orden enviada. No se toma climate.* como
      # feedback físico porque el control IR es de lazo abierto.
      commanded_power_helper: input_boolean.climatizacion_estado_comandado
      commanded_mode_helper: input_select.climatizacion_modo_comandado
      commanded_temperature_helper: input_number.climatizacion_temperatura_comandada
      commanded_fan_helper: input_select.climatizacion_ventilador_comandado
      session_sync_helper: input_boolean.climatizacion_sincronizado_sesion
      control_mode_helper: input_select.climatizacion_control_mode
      heat_demand_helper: input_boolean.climatizacion_demanda_calor
      cool_demand_helper: input_boolean.climatizacion_demanda_frio
      last_event_helper: input_text.climatizacion_ultimo_evento

