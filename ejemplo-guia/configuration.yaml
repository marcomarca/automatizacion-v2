  # Panel responsive para supervisión y control de la impresora 3D.
  # Archivo requerido, con nombre exacto: /config/www/impresiones-panel.js
  - name: impresiones-panel
    url_path: impresiones
    sidebar_title: Impresiones 3D
    sidebar_icon: mdi:printer-3d
    # La versión evita que el navegador reutilice el JavaScript anterior.
    module_url: /local/impresiones-panel.js?v=1.2.1
    require_admin: false
    config:
      title: Impresiones
      brand: Witmind
      subtitle: Control de impresión 3D
      site_label: WTX · MDTC
      logo: /local/logo-witmind.png?v=2.0.0

      # Estado general y avance de la impresión.
      status_sensor: sensor.f005_114b_estado_de_impresion
      object_sensor: sensor.f005_114b_objeto_actual
      progress_sensor: sensor.f005_114b_progreso_de_impresion
      current_layer_sensor: sensor.f005_114b_capa_actual
      total_layers_sensor: sensor.f005_114b_capas_totales
      elapsed_time_sensor: sensor.f005_114b_tiempo_de_trabajo_de_impresion
      remaining_time_sensor: sensor.f005_114b_tiempo_restante_de_impresion

      # Cámara y vista previa. Captura estable limitada a 2 FPS con doble búfer.
      camera: camera.f005_114b_camara_de_la_impresora
      preview_image: image.f005_114b_vista_previa_de_la_impresion_actual
      camera_fps: 2

      # Telemetría de trabajo.
      object_count_sensor: sensor.f005_114b_cantidad_de_objetos
      material_used_sensor: sensor.f005_114b_material_usado
      speed_sensor: sensor.f005_114b_velocidad_de_impresion
      realtime_flow_sensor: sensor.f005_114b_flujo_en_tiempo_real
      flow_rate_sensor: sensor.f005_114b_tasa_de_flujo
      filament_status_sensor: sensor.f005_114b_estado_del_filamento

      # Temperaturas y objetivos configurables.
      nozzle_temperature: sensor.f005_114b_temperatura_de_la_boquilla
      nozzle_maximum: sensor.f005_114b_temperatura_maxima_de_la_boquilla
      nozzle_target: number.f005_114b_objetivo_de_la_boquilla
      bed_temperature: sensor.f005_114b_temperatura_de_la_cama
      bed_maximum: sensor.f005_114b_temperatura_maxima_de_la_cama
      bed_target: number.f005_114b_objetivo_de_la_cama
      chamber_temperature: sensor.f005_114b_temperatura_de_la_camara
      history_hours: 6

      # Acciones críticas. El panel valida el estado antes de habilitarlas y
      # vuelve a validarlo inmediatamente antes de enviar el servicio.
      pause_button: button.f005_114b_pausar_la_impresion
      resume_button: button.f005_114b_reanudar_la_impresion
      stop_button: button.f005_114b_detener_la_impresion
      home_button: button.f005_114b_inicio_xy_y_luego_z
      reconnect_button: button.f005_114b_reconectar

      # Ajuste de velocidad con edición pendiente: mover la barra o pulsar +/-
      # no envía órdenes. Solo se envía un valor al pulsar Aplicar.
      speed_adjustment: number.f005_114b_ajuste_de_impresion
      speed_safe_min: 50
      speed_safe_max: 120
      speed_confirm_delta: 10

      # Zonas térmicas recomendadas. Los límites físicos definitivos continúan
      # siendo min/max de las entidades number.* y los del firmware.
      nozzle_safe_max: 260
      nozzle_confirm_delta: 15
      bed_safe_max: 110
      bed_confirm_delta: 10

      # Luz y ventiladores. Las reducciones protegidas durante una impresión
      # activa requieren una única confirmación al aplicar el valor final.
      printer_light: light.f005_114b_luz
      fan_confirm_delta: 30
      fans:
        - entity: fan.f005_114b_ventilador_del_modelo
          name: Ventilador del modelo
          protect_while_printing: true
          confirm_delta: 30
        - entity: fan.f005_114b_ventilador_de_la_carcasa
          name: Ventilador de carcasa
          protect_while_printing: true
          confirm_delta: 30
        - entity: fan.f005_114b_ventilador_lateral
          name: Ventilador lateral
          protect_while_printing: true
          confirm_delta: 30

      # Posición del cabezal.
      position_x: sensor.f005_114b_posicion_x
      position_y: sensor.f005_114b_posicion_y
      position_z: sensor.f005_114b_posicion_z

