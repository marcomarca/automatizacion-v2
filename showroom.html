<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Witmind Showroom Panel — Réplica de Test</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0b0f19;
        color: #f8fafc;
      }
      .test-banner {
        background: linear-gradient(90deg, #1e293b, #0f172a);
        border-bottom: 1px solid #334155;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        position: sticky;
        top: 0;
        z-index: 9999;
      }
      .test-banner a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
      }
      .test-banner a:hover {
        text-decoration: underline;
      }
      .test-badge {
        background: #0284c7;
        color: #ffffff;
        padding: 3px 8px;
        border-radius: 9999px;
        font-weight: 700;
        font-size: 11px;
        margin-right: 8px;
      }
      showroom-panel {
        display: block;
        width: 100%;
        min-height: calc(100vh - 42px);
      }
    </style>
  </head>
  <body>
    <div class="test-banner">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="test-badge">LOVELACE HA</span>
        <strong>Showroom Panel Replica (v1.5.1)</strong> — Simulación reactiva Home Assistant
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; color: #94a3b8; font-weight: 700;">VERSIONES HTML:</span>
        <a href="/showroom-witmind-os.html" style="padding: 4px 8px; background: #f26522; color: #fff; border-radius: 4px; font-size: 11px; font-weight: bold;">✨ Witmind OS</a>
        <a href="/showroom-witmind-os-light.html" style="padding: 4px 8px; background: #e2e8f0; color: #0f172a; border-radius: 4px; font-size: 11px; font-weight: bold;">☀️ OS Claro</a>
        <a href="/showroom-witmind-light.html" style="padding: 4px 8px; background: #e2e8f0; color: #0f172a; border-radius: 4px; font-size: 11px;">☀️ Witmind Glass Claro</a>
        <a href="/showroom-witmind.html" style="padding: 4px 8px; background: #1e293b; color: #fff; border-radius: 4px; font-size: 11px;">🏛️ Witmind Glass</a>
        <a href="/showroom-aero.html" style="padding: 4px 8px; background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; border-radius: 4px; font-size: 11px; font-weight: bold;">💎 Showroom Aero</a>
        <a href="/showroom-ios.html" style="padding: 4px 8px; background: #1e293b; border-radius: 4px; font-size: 11px;">📱 Showroom iOS</a>
        <a href="/dashboard-bms.html" style="padding: 4px 8px; background: #1e293b; border-radius: 4px; font-size: 11px;">🌌 BMS Dark</a>
        <a href="/dashboard-matrix.html" style="padding: 4px 8px; background: #1e293b; border-radius: 4px; font-size: 11px;">📟 SCADA Matrix</a>
        <a href="/dashboard-exec.html" style="padding: 4px 8px; background: #1e293b; border-radius: 4px; font-size: 11px;">☀️ Executive Light</a>
        <a href="/#/overview" style="padding: 4px 8px; background: #334155; color: #fff; border-radius: 4px; font-size: 11px;">⚡ App Shell SPA ↗</a>
      </div>
    </div>

    <!-- Elemento del panel exacto del archivo ejemplo-guia (READ ONLY) -->
    <showroom-panel id="showroomPanel"></showroom-panel>

    <!-- Proveedor Genérico Mock Home Assistant -->
    <script src="/mock/mock-hass.js"></script>

    <!-- Carga del script del panel original sin tocar -->
    <script src="/ejemplo-guia/www/showroom-panel.js"></script>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const panel = document.getElementById("showroomPanel");
        if (panel && window.registerMockHassConsumer) {
          window.registerMockHassConsumer(panel);
        }
      });
      const panel = document.getElementById("showroomPanel");
      if (panel && window.registerMockHassConsumer) {
        window.registerMockHassConsumer(panel);
      }
    </script>
  </body>
</html>
