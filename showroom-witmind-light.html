<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Witmind Showroom — Architectural Light Glass</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        min-height: 100dvh;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
      }

      /* Dev & Version Switcher Top Bar */
      .version-top-bar {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        padding: 8px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        position: sticky;
        top: 0;
        z-index: 99999;
      }
      .version-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .version-badge {
        background: #f26522;
        color: #ffffff;
        padding: 3px 9px;
        border-radius: 9999px;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.04em;
        box-shadow: 0 0 12px rgba(242, 101, 34, 0.25);
      }
      .version-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .version-links a {
        color: #475569;
        text-decoration: none;
        padding: 4px 10px;
        background: rgba(15, 23, 42, 0.04);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.15s;
      }
      .version-links a:hover {
        background: rgba(242, 101, 34, 0.1);
        color: #f26522;
        border-color: #f26522;
      }
      .version-links a.current {
        background: rgba(242, 101, 34, 0.12);
        color: #f26522;
        border-color: #f26522;
        font-weight: 700;
      }

      showroom-witmind {
        display: block;
        width: 100%;
        min-height: calc(100dvh - 38px);
      }
    </style>
  </head>
  <body>
    <!-- Barra de Selección de Variantes de Diseño -->
    <div class="version-top-bar">
      <div class="version-brand">
        <span class="version-badge">TEMA CLARO</span>
        <strong>Showroom Witmind Light Glass</strong>
        <span style="color: #64748b; font-size: 12px;">• Studio Frost & Lighting Accent</span>
      </div>
      <div class="version-links">
        <span style="font-size: 11px; color: #94a3b8; font-weight: 700;">VARIANTES:</span>
        <a href="/showroom-witmind-os.html">✨ Witmind OS (Comercial)</a>
        <a href="/showroom-witmind-os-light.html">☀️ Witmind OS Claro</a>
        <a href="/showroom-witmind-light.html" class="current">☀️ Witmind Glass Claro</a>
        <a href="/showroom-witmind.html">🏛️ Witmind Glass</a>
        <a href="/showroom-aero.html">💎 Showroom Aero</a>
        <a href="/showroom-ios.html">📱 Showroom iOS</a>
        <a href="/showroom.html">🎛️ Lovelace HA (Original)</a>
        <a href="/dashboard-bms.html">🌌 BMS Dark</a>
        <a href="/dashboard-matrix.html">📟 SCADA Matrix</a>
        <a href="/dashboard-exec.html">☀️ Executive</a>
        <a href="/#/overview" style="background: rgba(242, 101, 34, 0.15); border-color: rgba(242, 101, 34, 0.4); color: #c2410c;">⚡ App Shell ↗</a>
      </div>
    </div>

    <!-- Componente Web Showroom Witmind Glass en Modo Claro -->
    <showroom-witmind id="witmindPanel" theme="light"></showroom-witmind>

    <!-- Proveedor Genérico Mock Home Assistant (Reactivo) -->
    <script src="/mock/mock-hass.js"></script>

    <!-- Script del Componente Witmind Glass -->
    <script src="/mock/showroom-witmind.js"></script>

    <!-- Registro Reactivo del Consumidor Mock Hass -->
    <script>
      function registerWitmindLight() {
        const panel = document.getElementById("witmindPanel");
        if (panel && window.registerMockHassConsumer) {
          window.registerMockHassConsumer(panel);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", registerWitmindLight);
      } else {
        registerWitmindLight();
      }
    </script>
  </body>
</html>
